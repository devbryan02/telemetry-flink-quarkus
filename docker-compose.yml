# Telemetría en tiempo real: Kafka, API (Quarkus + Flink embebido) y dashboard (Next.js).
#   docker compose up -d --build     levanta todo   →  http://localhost:3000
#   docker compose up -d kafka       solo Kafka, para desarrollar la API o el dashboard en local
services:
  kafka:
    # 4.1.2+ corrige KAFKA-19888: con 4.0.0, un retroceso del reloj (frecuente en la VM de Docker Desktop)
    # deja inutilizable el coordinador de grupos y los consumidores no pueden unirse ni confirmar offsets.
    image: apache/kafka:4.2.1
    container_name: telemetria-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # INTERNO para los contenedores (kafka:29092), EXTERNO para el host (localhost:9092)
      KAFKA_LISTENERS: INTERNO://:29092,EXTERNO://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNO://kafka:29092,EXTERNO://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNO:PLAINTEXT,EXTERNO:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNO
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_RETENTION_HOURS: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-datos:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20

  # Crea los topics (idempotente) y termina. Equivale a scripts/crear-topics.sh.
  kafka-init:
    image: apache/kafka:4.2.1
    container_name: telemetria-kafka-init
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        K="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092"
        $$K --create --if-not-exists --topic telemetria --partitions 12 --config retention.ms=3600000
        $$K --create --if-not-exists --topic ultima-posicion --partitions 12 --config cleanup.policy=compact
        $$K --list
    restart: "no"

  telemetry-api:
    build: ./telemetry-api
    image: telemetria/telemetry-api:latest
    container_name: telemetria-api
    restart: unless-stopped
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    ports:
      - "8080:8080"   # REST y WebSocket
      - "8081:8081"   # UI de Flink
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      QUARKUS_HTTP_CORS_ORIGINS: http://localhost:3000
      FLINK_UI_BIND_ADDRESS: 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/rutas > /dev/null"]
      interval: 5s
      timeout: 5s
      start_period: 30s
      retries: 20

  dashboard:
    build:
      context: ./dashboard-next
      args:
        # el navegador del host llega a la API por el puerto publicado
        NEXT_PUBLIC_API_URL: http://localhost:8080
        NEXT_PUBLIC_WS_URL: ws://localhost:8080/ws/autos
    image: telemetria/dashboard:latest
    container_name: telemetria-dashboard
    restart: unless-stopped
    depends_on:
      telemetry-api:
        condition: service_healthy
    ports:
      - "3000:3000"

volumes:
  kafka-datos:
