# Kafka (docker compose, ver docker-compose.yml)
quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/telemetria}
%dev.quarkus.datasource.username=${POSTGRES_USER:telemetria}
%dev.quarkus.datasource.password=${POSTGRES_PASSWORD}
quarkus.flyway.migrate-at-start=true
quarkus.flyway.clean-disabled=true
quarkus.micrometer.binder.kafka.enabled=true
%test.quarkus.datasource.devservices.image-name=postgres:17
%test.quarkus.datasource.devservices.reuse=false
kafka.bootstrap.servers=localhost:9092
quarkus.kafka.devservices.enabled=false

mp.messaging.incoming.ultima-posicion.connector=smallrye-kafka
mp.messaging.incoming.ultima-posicion.topic=ultima-posicion
mp.messaging.incoming.ultima-posicion.group.id=quarkus-dash-postgres
mp.messaging.incoming.ultima-posicion.auto.offset.reset=earliest
mp.messaging.incoming.ultima-posicion.value.deserializer=dev.bryan.autos.AutoEventoDeserializer
mp.messaging.incoming.ultima-posicion.batch=true
mp.messaging.incoming.ultima-posicion.enable.auto.commit=false
mp.messaging.incoming.ultima-posicion.commit-strategy=throttled
mp.messaging.incoming.ultima-posicion.failure-strategy=fail

# Historial de viajes (feature viajes): lee telemetria con su propio grupo
mp.messaging.incoming.historial-telemetria.connector=smallrye-kafka
mp.messaging.incoming.historial-telemetria.topic=telemetria
mp.messaging.incoming.historial-telemetria.group.id=quarkus-viajes-postgres
mp.messaging.incoming.historial-telemetria.auto.offset.reset=earliest
mp.messaging.incoming.historial-telemetria.value.deserializer=dev.bryan.viajes.EventoViajeDeserializer
mp.messaging.incoming.historial-telemetria.value-deserialization-failure-handler=historial-invalido
mp.messaging.incoming.historial-telemetria.batch=true
mp.messaging.incoming.historial-telemetria.enable.auto.commit=false
mp.messaging.incoming.historial-telemetria.commit-strategy=throttled
mp.messaging.incoming.historial-telemetria.failure-strategy=fail

# Simulación (feature simulacion): publica en telemetria
mp.messaging.outgoing.telemetria-out.connector=smallrye-kafka
mp.messaging.outgoing.telemetria-out.topic=telemetria
mp.messaging.outgoing.telemetria-out.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.telemetria-out.value.serializer=org.apache.kafka.common.serialization.StringSerializer
simulacion.escenario=carrera
simulacion.intervalo-ms=1000

# HTTP
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.enable-compression=true

# Flink embebido (lo lee FlinkJobRunner)
flink.enabled=true
flink.parallelism=4
flink.ui.port=8081
flink.ui.bind-address=localhost
flink.kafka.group=flink-ultima-pos
flink.topic.in=telemetria
flink.topic.out=ultima-posicion

# En tests no se levanta el job (se prueba la lógica aparte, sin Kafka)
%test.flink.enabled=false
# Puerto aleatorio en tests: el 8081 por defecto choca con la UI de Flink de la app en ejecución
%test.quarkus.http.test-port=0
