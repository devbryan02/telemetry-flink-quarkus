# Kafka (docker compose, ver docker-compose.yml)
kafka.bootstrap.servers=localhost:9092
quarkus.kafka.devservices.enabled=false

mp.messaging.incoming.ultima-posicion.connector=smallrye-kafka
mp.messaging.incoming.ultima-posicion.topic=ultima-posicion
mp.messaging.incoming.ultima-posicion.group.id=quarkus-dash
mp.messaging.incoming.ultima-posicion.auto.offset.reset=earliest
mp.messaging.incoming.ultima-posicion.value.deserializer=dev.bryan.autos.AutoDeserializer
mp.messaging.incoming.ultima-posicion.batch=true
# Confirmar offsets cada 200 ms (por defecto 5 s) para que el lag medido del grupo sea preciso (spec §11)
mp.messaging.incoming.ultima-posicion.auto.commit.interval.ms=200
mp.messaging.incoming.ultima-posicion.failure-strategy=ignore
mp.messaging.incoming.ultima-posicion.consumer-rebalance-listener.name=reconstruir-estado

# HTTP
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://localhost:3000
quarkus.http.enable-compression=true

# Flink embebido (lo lee FlinkJobRunner)
flink.enabled=true
flink.parallelism=4
flink.ui.port=8081
flink.kafka.group=flink-ultima-pos
flink.topic.in=telemetria
flink.topic.out=ultima-posicion

# En tests no se levanta el job (se prueba la lógica aparte, sin Kafka)
%test.flink.enabled=false
# Puerto aleatorio en tests: el 8081 por defecto choca con la UI de Flink de la app en ejecución
%test.quarkus.http.test-port=0
