services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: e2e
      POSTGRES_PASSWORD: e2e-solo-pruebas
      POSTGRES_DB: e2e
    volumes:
      - datos:/var/lib/postgresql/data
  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
  api:
    build:
      context: ../../..
      dockerfile: src/test/resources/Dockerfile.persistencia
    ports:
      - "127.0.0.1::8080"
      - "127.0.0.1::8081"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/e2e
      QUARKUS_DATASOURCE_USERNAME: e2e
      QUARKUS_DATASOURCE_PASSWORD: e2e-solo-pruebas
      QUARKUS_DATASOURCE_JDBC_ACQUISITION_TIMEOUT: 3S
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      FLINK_UI_BIND_ADDRESS: 0.0.0.0
volumes:
  datos:
